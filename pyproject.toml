[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad-pro-tab"
version = "1.0.0"
description = "Launchpad Pro TAB Edition – touch-optimierte Launchpad-Software (Soundboard) für den Theaterbetrieb"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TAB Theater" }]
dependencies = [
    "PySide6-Essentials>=6.8",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "av>=12.0",
    "soxr>=0.3.7",
    "pycaw>=20240316; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.gui-scripts]
launchpad-pro-tab = "launchpad_pro_tab.app:main"

[tool.setuptools.packages.find]
include = ["launchpad_pro_tab*"]

[tool.setuptools.package-data]
launchpad_pro_tab = ["qml/*.qml", "qml/qmldir", "qml/icons/*.svg", "assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
