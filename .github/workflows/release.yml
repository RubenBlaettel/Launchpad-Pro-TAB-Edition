# Veröffentlicht eine neue Version als GitHub-Release (Windows-Installer + Linux-Paket).
# Installierte Programme finden sie beim nächsten Start über die Update-Prüfung.
#
# So geht's:
#   1. Versionsnummer in launchpad_pro_tab/__init__.py erhöhen, CHANGELOG.md ergänzen, committen
#   2. Tag setzen und pushen:  git tag v1.2.0 && git push origin v1.2.0
#      (oder auf GitHub: Actions › Release › „Run workflow“ – verwendet die Version aus dem Code)
# Versionen mit Buchstaben (z. B. 1.3.0-beta.1) werden als Vorabversion veröffentlicht.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('launchpad_pro_tab/__init__.py', encoding='utf-8').read()).group(1))")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Programmversion $VERSION (launchpad_pro_tab/__init__.py)."
            exit 1
          fi
          case "$VERSION" in *[a-zA-Z]*) PRE=true ;; *) PRE=false ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (Vorabversion: $PRE)"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Release veröffentlichen
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Windows-Installer holen
        uses: actions/download-artifact@v4
        with:
          name: LaunchpadProTAB-Windows-Installer
          path: release
      - name: Linux-Paket holen
        uses: actions/download-artifact@v4
        with:
          name: LaunchpadProTAB-Linux
          path: release
      - name: Prüfsummen und Versionshinweise
        run: |
          ls -la release
          test -f "release/LaunchpadProTAB-Setup-$VERSION.exe"
          test -f "release/LaunchpadProTAB-$VERSION-linux-x86_64.tar.gz"
          (cd release && sha256sum LaunchpadProTAB-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 tools/release_notes.py "$VERSION" > notes.md
          cat notes.md
      - name: Release anlegen
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release/* --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" release/* --title "Launchpad Pro TAB Edition $VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA" $FLAGS
          fi
