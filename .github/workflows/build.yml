# Wiederverwendbarer Build: Tests, Windows-Programm + Installer, Linux-Paket.
# Aufgerufen von ci.yml (jeder Push) und release.yml (Veröffentlichung).
name: Build

on:
  workflow_call:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Smoke-Test (Quellcode)
        run: python -m launchpad_pro_tab --smoke-test

  windows:
    name: Windows-Programm + Installer
    needs: tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: EXE bauen (PyInstaller)
        run: pyinstaller packaging/launchpad_pro_tab.spec --noconfirm
      - name: Smoke-Test der EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\LaunchpadProTAB\LaunchpadProTAB.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:APPDATA\LaunchpadProTAB\launchpad.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { Write-Error "Smoke-Test fehlgeschlagen (Code $($p.ExitCode))"; exit 1 }
      - name: Inno Setup 7 installieren
        shell: pwsh
        run: |
          # Feste Version mit geprüfter Prüfsumme (offizielles Release auf GitHub)
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $file = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          if ($hash -ne "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F") {
            throw "Prüfsumme von Inno Setup stimmt nicht: $hash"
          }
          $p = Start-Process -FilePath $file -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=C:\InnoSetup" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation von Inno Setup fehlgeschlagen (Code $($p.ExitCode))" }
          "ISCC=C:\InnoSetup\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Installer bauen
        run: python tools/build_installer.py
      - name: Installer testen (Installation, Update, Deinstallation)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\LaunchpadProTAB-Setup-*.exe" | Select-Object -First 1
          ./tools/test_windows_installer.ps1 -Setup $setup.FullName
      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LaunchpadProTAB-Windows-Installer
          path: dist/LaunchpadProTAB-Setup-*.exe
          retention-days: 30
      - name: Programmordner hochladen (portabel)
        uses: actions/upload-artifact@v4
        with:
          name: LaunchpadProTAB-Windows
          path: dist/LaunchpadProTAB
          retention-days: 30
      - name: Installer-Protokolle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Installer-Protokolle
          path: ${{ runner.temp }}/installer-logs
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux-Paket
    needs: tests
    # Ältere Ubuntu-Version = breite Kompatibilität (glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 36+)
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libportaudio2 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 \
            desktop-file-utils shared-mime-info
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Programm bauen (PyInstaller)
        run: pyinstaller packaging/launchpad_pro_tab.spec --noconfirm
      - name: Paket bauen
        run: python tools/build_linux_package.py
      - name: Paket testen (Installation, Update, Deinstallation)
        run: sh tools/test_linux_package.sh dist/LaunchpadProTAB-*-linux-x86_64.tar.gz
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LaunchpadProTAB-Linux
          path: dist/LaunchpadProTAB-*-linux-x86_64.tar.gz
          retention-days: 30
